<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>الإدارة | ف الكلامِ كلام</title><link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--or:#F45102;--ink:#111;--g:#f3f3f3;--m:#6b6b6b}
*{box-sizing:border-box}body{margin:0;font-family:"IBM Plex Sans Arabic",sans-serif;color:var(--ink);background:#fff;line-height:1.7}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:2px solid var(--ink)}header img{height:34px}header b{font-family:"Reem Kufi",sans-serif;font-size:18px}
main{max-width:620px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:8px;margin-bottom:18px}.tabs button{flex:1;padding:10px;border:2px solid var(--ink);background:#fff;border-radius:999px;font:600 15px inherit;font-family:inherit;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
h1{font-family:"Reem Kufi",sans-serif;font-size:30px;margin:6px 0 14px}h2{font-size:20px;margin:0 0 8px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;border:2px solid var(--ink);background:#fff;font:600 16px inherit;font-family:inherit;cursor:pointer;color:var(--ink)}.btn.pri{background:var(--or);border-color:var(--or);color:#fff}.btn.sm{padding:6px 14px;font-size:14px}.btn[disabled]{opacity:.5}
.card{border:2px solid var(--ink);border-radius:20px;padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center}.card .n{font-family:"Reem Kufi",sans-serif;font-size:34px;color:var(--or);min-width:40px;text-align:center}.card .t{flex:1}.card .t b{display:block;font-size:17px}.card .t small{color:var(--m)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 10px;border-radius:999px;background:var(--ink);color:#fff}.pill.d{background:var(--g);color:var(--m)}
.acts{display:flex;flex-direction:column;gap:6px}
label{display:block;font-weight:600;margin:14px 0 4px}label small{font-weight:400;color:var(--m);display:block;line-height:1.5}
input,select,textarea{width:100%;font:16px inherit;font-family:inherit;padding:12px 14px;border:2px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink)}textarea{min-height:110px}
input[readonly]{background:var(--g)}
.msg{margin:14px 0;padding:12px 14px;border-radius:14px;background:var(--g)}.msg.err{background:#fde8e1;color:#a23100}.msg.ok{background:#e8f6ec;color:#1b6b34}
.row2{display:flex;gap:10px}.row2>*{flex:1}.top{display:flex;justify-content:space-between;align-items:center}
.card.qc{flex-wrap:wrap}.card.qc .t{min-width:60%}.card.qc .acts{flex-direction:row;flex-wrap:wrap;width:100%;gap:8px}.card.qc .acts .btn[disabled]{opacity:.35}
.muted{color:var(--m);font-size:14px}
</style></head><body>
<header><img src="logo-t.png" alt=""><b>الإدارة</b></header>
<main id="app"></main>
<script src="admin.js"></script></body></html>
