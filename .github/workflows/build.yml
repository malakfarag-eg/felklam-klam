name: build
on:
  push:
    branches: [main]
    paths: ['data/episodes.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 build2.py
      - run: |
          git config user.name "felklam-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "rebuild pages" && git push)
